name: iOS — TestFlight build

# Manual only, like the Android APK workflow — trigger from the Actions tab
# whenever you want a fresh TestFlight build from the current main branch.
# Requires the signing secrets produced by "iOS — bootstrap signing" (run
# that one first, exactly once) plus the same App Store Connect API key
# secrets it uses.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Rooted at "/" instead of "/OCD/" — the native app loads its assets
      # from its own local root, same reasoning as the Android build.
      - run: npm run build:capacitor
      - run: npx cap sync ios

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Decode signing assets
        # openssl base64 -d, not the OS's own `base64` binary — the two
        # secrets are wrapped, multi-line base64 (many short lines, not one
        # giant one — needed so they can actually be selected in full on a
        # phone), and macOS's base64 has already proven itself different
        # from Linux's in this exact project (the earlier OpenSSL curve-name
        # issue was the same category of surprise). Using the very same
        # tool that encoded these files in bootstrap_signing's Fastfile
        # removes any cross-implementation ambiguity about how multi-line
        # input gets handled.
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "${{ secrets.IOS_DIST_CERT_P12_BASE64 }}" | openssl base64 -d > "$RUNNER_TEMP/signing/cert.p12"
          echo "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" | openssl base64 -d > "$RUNNER_TEMP/signing/profile.mobileprovision"

          # Fail loudly right here if either secret produced nothing usable,
          # instead of finding out several steps later via a cryptic
          # "wrong password" or "zero-length data" error from fastlane.
          ls -la "$RUNNER_TEMP/signing"
          if [ ! -s "$RUNNER_TEMP/signing/cert.p12" ]; then
            echo "::error::cert.p12 decoded to zero bytes — the IOS_DIST_CERT_P12_BASE64 secret is empty or missing."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/signing/profile.mobileprovision" ]; then
            echo "::error::profile.mobileprovision decoded to zero bytes — the IOS_PROVISION_PROFILE_BASE64 secret is empty or missing."
            exit 1
          fi

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_PATH: ${{ runner.temp }}/signing/cert.p12
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_PATH: ${{ runner.temp }}/signing/profile.mobileprovision
        run: bundle exec fastlane ios beta

      - name: Clean up decoded signing assets
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
