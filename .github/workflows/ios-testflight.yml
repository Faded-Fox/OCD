name: iOS — TestFlight build

# Manual only, like the Android APK workflow — trigger from the Actions tab
# whenever you want a fresh TestFlight build from the current main branch.
# Requires the signing secrets produced by "iOS — bootstrap signing" (run
# that one first, exactly once) plus the same App Store Connect API key
# secrets it uses.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Rooted at "/" instead of "/OCD/" — the native app loads its assets
      # from its own local root, same reasoning as the Android build.
      - run: npm run build:capacitor
      - run: npx cap sync ios

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Decode signing assets
        # Two things here, both defenses against the same underlying
        # weakness: embedding a large multi-line secret literally into a
        # run: script's text (`echo "${{ secrets.X }}"`) is a known-fragile
        # pattern in GitHub Actions — the cert (~60 lines) made it through
        # fine but the larger provisioning profile (~260 lines) kept
        # decoding to zero bytes despite the secret itself being verified
        # correct, which points at something about the YAML-to-script text
        # substitution step itself, not the secret's content. Passing both
        # through as real environment variables and reading them back as
        # shell variables sidesteps that path entirely — the OS delivers an
        # env var's bytes as-is, with no text-embedding step to go wrong.
        #
        # Also openssl base64 -d rather than the OS's own `base64` binary —
        # it's the exact same tool bootstrap_signing's Fastfile used to
        # encode these files, removing any cross-implementation ambiguity
        # (macOS's base64 has already proven itself different from Linux's
        # once before in this project, in the OpenSSL curve-name issue).
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | openssl base64 -d > "$RUNNER_TEMP/signing/cert.p12"
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | openssl base64 -d > "$RUNNER_TEMP/signing/profile.mobileprovision"

          # Fail loudly right here if either secret produced nothing usable,
          # instead of finding out several steps later via a cryptic
          # "wrong password" or "zero-length data" error from fastlane.
          ls -la "$RUNNER_TEMP/signing"
          if [ ! -s "$RUNNER_TEMP/signing/cert.p12" ]; then
            echo "::error::cert.p12 decoded to zero bytes — the IOS_DIST_CERT_P12_BASE64 secret is empty or missing."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/signing/profile.mobileprovision" ]; then
            echo "::error::profile.mobileprovision decoded to zero bytes — the IOS_PROVISION_PROFILE_BASE64 secret is empty or missing."
            exit 1
          fi

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_PATH: ${{ runner.temp }}/signing/cert.p12
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_PATH: ${{ runner.temp }}/signing/profile.mobileprovision
        run: bundle exec fastlane ios beta

      - name: Clean up decoded signing assets
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
